name: Build ExtendReality iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Clean project.yml for Unsigned Build
        run: |
          ruby -r yaml -e '
            data = YAML.load_file("project.yml")
            if data["targets"]
              data["targets"].each do |name, target|
                target.delete("entitlements")
                target["settings"] ||= {}
                target["settings"]["base"] ||= {}
                target["settings"]["base"]["CODE_SIGNING_ALLOWED"] = "NO"
                target["settings"]["base"]["CODE_SIGNING_REQUIRED"] = "NO"
                target["settings"]["base"]["CODE_SIGN_IDENTITY"] = ""
                target["settings"]["base"]["DEVELOPMENT_TEAM"] = ""
                target["settings"]["base"]["PROVISIONING_PROFILE_SPECIFIER"] = ""
                if target["dependencies"]
                  target["dependencies"].each do |dep|
                    dep["codeSign"] = false if dep.is_a?(Hash) && dep.key?("codeSign")
                  end
                end
              end
            end
            File.write("project.yml", data.to_yaml)
          '

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve SPM Dependencies
        run: xcodebuild -resolvePackageDependencies -project ExtendReality.xcodeproj -scheme ExtendReality

      - name: Build Application (iOS ARM64 Device)
        run: |
          xcodebuild build \
            -project ExtendReality.xcodeproj \
            -scheme ExtendReality \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "ExtendReality.app" -type d | head -n 1)
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r ExtendReality.ipa Payload

      - name: Verify IPA
        run: |
          unzip -l build/ExtendReality.ipa | grep "Payload/ExtendReality.app/"
          file build/Payload/ExtendReality.app/ExtendReality

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtendReality-iOS-IPA
          path: build/ExtendReality.ipa
          retention-days: 30
