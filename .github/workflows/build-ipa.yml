name: Build ExtendReality iOS IPA
on:
workflow_dispatch:
push:
branches:
- main
- master
permissions:
contents: read
jobs:
build-ipa:
runs-on: macos-15
timeout-minutes: 60
steps:
- name: Checkout Repository
uses: actions/checkout@v4
- name: Set up Xcode
uses: maxim-lobanov/setup-xcode@v1
with:
xcode-version: 'latest-stable'
- name: Build Unsigned iOS App
run: |
xcodebuild build 
-project ExtendReality.xcodeproj 
-scheme "ExtendReality" 
-sdk iphoneos 
-configuration Release 
-derivedDataPath build 
CODE_SIGN_IDENTITY="" 
CODE_SIGNING_REQUIRED=NO 
CODE_SIGNING_ALLOWED=NO
- name: Package Unsigned IPA
run: |
mkdir -p Payload
cp -R build/Build/Products/Release-iphoneos/*.app Payload/
zip -r ExtendReality_unsigned.ipa Payload
- name: Upload IPA Artifact
uses: actions/upload-artifact@v4
with:
name: ExtendReality-Unsigned-IPA
path: ExtendReality_unsigned.ipa
retention-days: 14
