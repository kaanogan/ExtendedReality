name: Build ExtendReality iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -e

          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.4.app"
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.3.app"
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.2.app"
          else
            sudo xcode-select -s "/Applications/Xcode.app"
          fi

          echo "Xcode path:"
          xcode-select -p

          echo "Xcode version:"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -e

          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen already installed"
          else
            brew install xcodegen
          fi

          xcodegen --version

      - name: Generate Xcode Project
        run: |
          set -e

          rm -rf ExtendReality.xcodeproj

          xcodegen generate

          if [ ! -d "ExtendReality.xcodeproj" ]; then
            echo "ERROR: Xcode project was not generated."
            exit 1
          fi

          echo "Xcode project generated successfully."

      - name: List Xcode Project
        run: |
          set -e

          xcodebuild \
            -project ExtendReality.xcodeproj \
            -list

      - name: Resolve Swift Package Dependencies
        run: |
          set -e

          mkdir -p build/SourcePackages

          xcodebuild \
            -resolvePackageDependencies \
            -project ExtendReality.xcodeproj \
            -scheme ExtendReality \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build ExtendReality
        id: build
        run: |
          rm -rf build/DerivedData
          mkdir -p build

          set +e

          xcodebuild \
            -project ExtendReality.xcodeproj \
            -scheme ExtendReality \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build/xcodebuild.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=================================================="
          echo "XCODEBUILD EXIT CODE: $BUILD_EXIT"
          echo "=================================================="

          echo ""
          echo "================ ACTUAL XCODE ERRORS ============"

          grep -E \
            "error:|fatal error:|Command .* failed|BUILD FAILED|Provisioning|CodeSign|Signing|No such module|SwiftCompile|CompileSwift|Ld |Linker" \
            build/xcodebuild.log \
            | tail -n 150 || true

          echo ""
          echo "================ LAST 100 LINES =================="

          tail -n 100 build/xcodebuild.log

          echo ""
          echo "=================================================="

          exit "$BUILD_EXIT"

      - name: Locate ExtendReality.app
        run: |
          set -e

          echo "Searching for ExtendReality.app..."

          APP_PATH=$(find build/DerivedData \
            -type d \
            -name "ExtendReality.app" \
            -path "*/Build/Products/Release-iphoneos/*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ExtendReality.app was not produced."

            if [ -f build/xcodebuild.log ]; then
              echo "===== BUILD ERRORS ====="
              grep -E "error:|fatal error:|BUILD FAILED" \
                build/xcodebuild.log \
                | tail -n 100 || true
            fi

            exit 1
          fi

          echo "Found application:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify ARM64 Device Binary
        run: |
          set -e

          BINARY="$APP_PATH/ExtendReality"

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: ExtendReality executable not found."
            exit 1
          fi

          echo "===== FILE ====="
          file "$BINARY"

          echo ""
          echo "===== ARCHITECTURE ====="
          lipo -info "$BINARY"

          if ! lipo -info "$BINARY" | grep -q "arm64"; then
            echo "ERROR: ARM64 architecture not found."
            exit 1
          fi

          echo "ARM64 device binary verified."

      - name: Verify App Bundle
        run: |
          set -e

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing."
            exit 1
          fi

          echo "Info.plist found."

          echo ""
          echo "===== APP CONTENTS ====="
          find "$APP_PATH" -maxdepth 3 -print | sort | head -n 300

      - name: Package IPA
        run: |
          set -e

          rm -rf build/IPA
          mkdir -p build/IPA/Payload

          cp -R \
            "$APP_PATH" \
            build/IPA/Payload/ExtendReality.app

          cd build/IPA

          zip -qry \
            ../ExtendReality.ipa \
            Payload

          cd ../..

          if [ ! -f build/ExtendReality.ipa ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo "===== IPA CREATED ====="
          ls -lh build/ExtendReality.ipa

      - name: Verify IPA
        run: |
          set -e

          echo "===== IPA CONTENTS ====="

          unzip -l build/ExtendReality.ipa \
            | grep "Payload/ExtendReality.app/"

          echo ""
          echo "===== ZIP TEST ====="

          unzip -t build/ExtendReality.ipa

          echo ""
          echo "IPA verified successfully."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ExtendReality-iOS-IPA
          path: build/ExtendReality.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExtendReality-Build-Logs
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 30
