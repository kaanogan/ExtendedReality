name: Build ExtendReality iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Patch Xcode Project Build Settings
        run: |
          sed -i '' 's/CODE_SIGN_ENTITLEMENTS = .*/CODE_SIGN_ENTITLEMENTS = "";/g' ExtendReality.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' ExtendReality.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = "";/g' ExtendReality.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' ExtendReality.xcodeproj/project.pbxproj

      - name: Resolve SPM Dependencies
        run: xcodebuild -resolvePackageDependencies -project ExtendReality.xcodeproj -scheme ExtendReality

      - name: Build Application (iOS ARM64 Device)
        run: |
          xcodebuild build \
            -project ExtendReality.xcodeproj \
            -scheme ExtendReality \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "ExtendReality.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: ExtendReality.app not found in DerivedData"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r ExtendReality.ipa Payload

      - name: Verify IPA Structure
        run: |
          unzip -l build/ExtendReality.ipa | grep "Payload/ExtendReality.app/"
          file build/Payload/ExtendReality.app/ExtendReality

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtendReality-iOS-IPA
          path: build/ExtendReality.ipa
          retention-days: 30
