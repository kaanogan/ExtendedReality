name: Build ExtendReality iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve SPM Dependencies
        run: xcodebuild -resolvePackageDependencies -project ExtendReality.xcodeproj -scheme ExtendReality

      - name: Build Application (Ad-Hoc Unsigned ARM64)
        run: |
          xcodebuild build -project ExtendReality.xcodeproj -scheme ExtendReality -destination "generic/platform=iOS" -configuration Release -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES AD_HOC_CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" PROVISIONING_PROFILE="" CODE_SIGN_ENTITLEMENTS="" ENABLE_USER_SCRIPT_SANDBOXING=NO SWIFT_COMPILATION_MODE=singlefile

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "ExtendReality.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: ExtendReality.app not found in DerivedData"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r ExtendReality.ipa Payload

      - name: Verify IPA Structure
        run: |
          unzip -l build/ExtendReality.ipa | grep "Payload/ExtendReality.app/"
          file build/Payload/ExtendReality.app/ExtendReality

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtendReality-iOS-IPA
          path: build/ExtendReality.ipa
          retention-days: 30
