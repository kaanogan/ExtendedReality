      - name: Build ExtendReality
        id: build
        continue-on-error: true
        run: |
          rm -rf build/DerivedData
          mkdir -p build
          set +e
          xcodebuild \
            -project ExtendReality.xcodeproj \
            -scheme ExtendReality \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build/xcodebuild.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=================================================="
          echo "XCODEBUILD EXIT CODE: $BUILD_EXIT"
          echo "=================================================="
          echo ""
          echo "================ ACTUAL ERRORS =================="
          grep -E \
            "error:|fatal error:|Command .* failed|BUILD FAILED|Provisioning|CodeSign|Signing|No such module|SwiftCompile|CompileSwift|Ld |Linker" \
            build/xcodebuild.log \
            | tail -n 150 || true
          echo ""
          echo "=============== LAST 100 LINES =================="
          tail -n 100 build/xcodebuild.log
          echo ""
          echo "=================================================="
          exit "$BUILD_EXIT"
